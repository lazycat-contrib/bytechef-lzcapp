version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/bytechef.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: true
  version_source:
    type: image
    image: bytechef
build:
  toolchains: []
  run_buildscript: false
images:
- id: bytechef
  target: service
  service: bytechef
  source: bytechef/bytechef
  channel: date
  sort: semver
  tag_regex: ^20[0-9]{6}$
  version_regex: ^(?P<version>[0-9]{4})(?P<month>[0-9]{2})(?P<day>[0-9]{2})$
  version_template: '{version}.{month}.{day}'
  delivery:
    mode: lazycat
  exclude_regex: ^20270718$
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ByteChef 自动化工作流
    summary: 开源 AI 智能体与工作流自动化平台，使用内置 H2 数据库
